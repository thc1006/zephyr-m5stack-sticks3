#
# Stack on top of overlay-audio.conf to run the ES8311 sample-rate sweep once at
# boot. It exists so CI compiles the sweep at all: the code sits behind
# #ifdef CONFIG_APP_AUDIO_RATE_SWEEP, which defaults to n, so without a build that
# turns it on the compiler never sees ~250 lines of it and a green CI says nothing
# about them.
#
# Not for normal images: the sweep reprograms I2S and the codec nine times and
# drives the speaker, then restores the application's own configuration.
CONFIG_APP_AUDIO_RATE_SWEEP=y
