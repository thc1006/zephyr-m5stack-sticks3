# I2S START/DROP stress test (mem-slab leak validation).
#
# Use WITH overlay-audio.conf:
#   west build ... -- -DEXTRA_CONF_FILE='overlay-audio.conf;overlay-i2s-stress.conf'
#
# Reconfigures, STARTs and DROPs the full-duplex stream 100 times, taking a census of
# the TX and RX memory slabs before each cycle and deliberately starving TX on every
# fifth. Zephyr's ESP32 I2S driver leaks the DMA's in-flight slab block on every DROP;
# i2s_buf_write() allocates with K_FOREVER, so an exhausted slab is a silent unkillable
# block rather than an error. Run this against a patched tree (expect a flat census)
# and against an unpatched one (expect the leak, reported rather than hung).
#
# See scripts/patch_zephyr_i2s_leak.sh and docs/06_RISK_REGISTER.md.
CONFIG_APP_I2S_STRESS=y
