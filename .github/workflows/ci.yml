name: CI

# Build the firmware for every overlay, run the native_sim unit tests, and run a
# scoped Zephyr compliance pass (issue #17). Everything is built out-of-tree
# against a pinned upstream Zephyr (BOARD_ROOT + ZEPHYR_EXTRA_MODULES = this
# repo) inside the official Zephyr CI container.
#
# The container is run via `docker run` on a plain runner, NOT via `container:`:
# the ~10 GB image exhausts the default runner disk during the `container:`
# image pull ("no space left on device"), which flaked ~2 random jobs per run
# (issue #20). Freeing the runner's pre-installed packages first, then pulling
# the image ourselves, removes that.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. There was no permissions block here at all, so every job ran
# with the default GITHUB_TOKEN scope, which is read/write on a push to this repo,
# and a third-party action pinned to a moving branch ran inside that scope. Nothing
# in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZEPHYR_REV: v4.4.0
  # ghcr.io/zephyrproject-rtos/ci image whose bundled SDK is 1.0.1.
  # Pinned by digest, not by tag: a tag can be re-pointed at different content
  # without anything in this repo changing.
  CI_IMAGE: ghcr.io/zephyrproject-rtos/ci:v0.29.1@sha256:37e841452087905085ffcd82ed44a223f3e7eb86bf9316443a313ae07e09cfe0
  # The image bundles the SDK at this path; point cmake straight at it.
  SDK_DIR: /opt/toolchains/zephyr-sdk-1.0.1

jobs:
  repo-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Repository integrity checks
        run: bash verify.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default, overlay: "", dtc: "", blob: false }
          - { name: audio, overlay: "overlay-audio.conf", dtc: "", blob: false }
          # The sweep lives behind #ifdef CONFIG_APP_AUDIO_RATE_SWEEP, which
          # defaults to n. Without this entry the compiler never sees it, and a
          # green CI would say nothing about ~250 lines of new code.
          - { name: audio-rate-sweep, overlay: "overlay-audio.conf;overlay-audio-rate-sweep.conf", dtc: "", blob: false }
          - { name: ir, overlay: "overlay-ir.conf", dtc: "", blob: false }
          - { name: psram, overlay: "overlay-psram.conf", dtc: "", blob: false }
          - { name: ble, overlay: "overlay-ble.conf", dtc: "", blob: true }
          - { name: wifi, overlay: "overlay-wifi.conf", dtc: "overlay-wifi.overlay", blob: true }
          - { name: demo, overlay: "overlay-ble.conf;overlay-audio.conf;overlay-ir.conf", dtc: "", blob: true }
    steps:
      - name: Free runner disk
        # Pinned to the v1.3.1 commit. This action runs sudo rm -rf across the
        # runner and prunes the Docker runtime that every later step uses, so a
        # moving @main reference is a supply-chain hole, not a convenience.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: repo
          # checkout stores the token in .git/config by default, and the container
          # below mounts this directory. Nothing here needs to talk to git again.
          persist-credentials: false
      - name: Build (${{ matrix.name }})
        run: |
          docker run --rm \
            -e ZEPHYR_REV="$ZEPHYR_REV" \
            -e ZEPHYR_SDK_INSTALL_DIR="$SDK_DIR" \
            -e OVERLAY="${{ matrix.overlay }}" \
            -e DTC="${{ matrix.dtc }}" \
            -e BLOB="${{ matrix.blob }}" \
            -v "${{ github.workspace }}/repo:/repo:ro" \
            "$CI_IMAGE" \
            bash -c 'set -eo pipefail
              mkdir -p /work && cd /work
              west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_REV" ws
              cd ws && west update --narrow -o=--depth=1 && west zephyr-export
              export BOARD_ROOT=/repo ZEPHYR_EXTRA_MODULES=/repo
              if [ "$BLOB" = "true" ]; then west blobs fetch hal_espressif; fi
              args=(-p always -b m5stack_sticks3/esp32s3/procpu /repo/app)
              extra=()
              [ -n "$OVERLAY" ] && extra+=(-DEXTRA_CONF_FILE="$OVERLAY")
              [ -n "$DTC" ] && extra+=(-DEXTRA_DTC_OVERLAY_FILE="$DTC")
              [ ${#extra[@]} -gt 0 ] && args+=(-- "${extra[@]}")
              west build "${args[@]}"
            '

  twister:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Free runner disk
        # Pinned to the v1.3.1 commit. This action runs sudo rm -rf across the
        # runner and prunes the Docker runtime that every later step uses, so a
        # moving @main reference is a supply-chain hole, not a convenience.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: repo
          # checkout stores the token in .git/config by default, and the container
          # below mounts this directory. Nothing here needs to talk to git again.
          persist-credentials: false
      - name: Twister (native_sim)
        run: |
          # The output directory is bind-mounted OUT of the container. It used to
          # live inside a `docker run --rm` filesystem with nothing mounted, so the
          # moment twister finished, every per-test log, generated .config, harness
          # output and failure file was deleted. --inline-logs kept some console
          # text; it did not keep the artifacts a reviewer would need to check a
          # claim afterwards, and PR #19's evidence for an 8 MB ext_dram_seg rests
          # on exactly the kind of build output that was being thrown away.
          mkdir -p "${{ github.workspace }}/twister-out"
          docker run --rm \
            -e ZEPHYR_REV="$ZEPHYR_REV" \
            -e ZEPHYR_SDK_INSTALL_DIR="$SDK_DIR" \
            -v "${{ github.workspace }}/repo:/repo:ro" \
            -v "${{ github.workspace }}/twister-out:/out" \
            "$CI_IMAGE" \
            bash -c 'set -eo pipefail
              mkdir -p /work && cd /work
              west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_REV" ws
              cd ws && west update --narrow -o=--depth=1 && west zephyr-export
              export ZEPHYR_EXTRA_MODULES=/repo
              west twister -p native_sim --inline-logs -v -T /repo/tests -O /out
            '

      - name: Keep the twister artifacts
        # if: always() - the run that FAILS is the one whose artifacts are worth
        # having, and the old workflow destroyed exactly those.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: twister-out
          path: twister-out
          retention-days: 14
          if-no-files-found: warn

  compliance:
    # PRs only: the checks run over the PR's own commits (base..head). On a push
    # to main the range is the squash-merge commit, which has no body and no
    # Signed-off-by, so Gitlint/Identity would false-fail there.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Free runner disk
        # Pinned to the v1.3.1 commit. This action runs sudo rm -rf across the
        # runner and prunes the Docker runtime that every later step uses, so a
        # moving @main reference is a supply-chain hole, not a convenience.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: repo
          # checkout stores the token in .git/config by default, and the container
          # below mounts this directory. Nothing here needs to talk to git again.
          persist-credentials: false
          fetch-depth: 0
      - name: Compliance (subset that fits an out-of-tree module repo)
        run: |
          docker run --rm \
            -e ZEPHYR_REV="$ZEPHYR_REV" \
            -e ZEPHYR_SDK_INSTALL_DIR="$SDK_DIR" \
            -e BASE_SHA="${{ github.event.pull_request.base.sha }}" \
            -e HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
            -v "${{ github.workspace }}/repo:/repo" \
            "$CI_IMAGE" \
            bash -c 'set -eo pipefail
              mkdir -p /work && cd /work
              west init -m https://github.com/zephyrproject-rtos/zephyr --mr "$ZEPHYR_REV" ws
              cd ws && west update --narrow -o=--depth=1 && west zephyr-export
              export ZEPHYR_BASE=/work/ws/zephyr
              git config --global --add safe.directory /repo
              cd /repo
              # Only the checks that are meaningful for an out-of-tree module
              # repo. Excluded (they false-fail on this layout): Kconfig /
              # SysbuildKconfig (our own CONFIG_* live in this module, reported
              # undefined), LicenseAndCopyrightCheck / BinaryFiles (evidence
              # media + logs), ClangFormat (the tree follows checkpatch).
              python3 "$ZEPHYR_BASE/scripts/ci/check_compliance.py" \
                -c "$BASE_SHA..$HEAD_SHA" \
                -m Checkpatch -m Gitlint -m Identity -m DevicetreeBindings -m Nits </dev/null
            '
