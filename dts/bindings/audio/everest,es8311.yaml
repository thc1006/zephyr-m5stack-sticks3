description: |
  Everest Semiconductor ES8311 low-power mono audio codec.

  The ES8311 is a single-chip mono ADC/DAC with an I2C control interface
  (7-bit address 0x18 or 0x19, selected by the CE pin) and an I2S/PCM audio
  data interface.

  The codec can take its internal master clock either from a dedicated MCLK
  pin or from the I2S bit clock.

  This driver supports the second of those only: it programs the codec to
  derive its master clock from BCLK. With a 16-bit stereo I2S frame that puts
  the master clock at 256 * Fs at every sample rate, so one set of clock
  registers serves 8 kHz through 48 kHz. Consequently:

  - audio_codec_configure() requires audio_codec_cfg.mclk_freq to be 0. That
    field describes the clock fed to the codec's MCLK *input* pin, and this
    driver never uses that pin, so any non-zero value would be describing a
    clock that is on no pin at all. It is rejected with -ENOTSUP rather than
    accepted and ignored.
  - Word sizes other than 16 bits are rejected for the same reason: a 24-bit
    frame carries 48 bit clocks and a 32-bit frame 64, which would put the
    master clock at 384 * Fs and 512 * Fs and silently mis-clock the codec.

  A board that wires a real MCLK into the codec would need register 0x01 bit 7
  cleared and its own divider values, which this driver does not implement.

compatible: "everest,es8311"

include: [i2c-device.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: |
      GPIO connected to the codec reset pin (active low), when a discrete reset
      line is wired. The driver asserts it, settles, and releases it at init.

      This driver does NOT issue the register-0x00 software reset. It is worth
      saying why, because the reference drivers do and a reader will expect it.
      Adding the reference sequence (assert the reset bits, wait, release, start
      the clock state machine) was measured on an ES8311 on real hardware and it
      leaves the ADC deaf: the capture noise floor collapses to zero at 8 kHz and
      the microphone hears nothing below roughly 22 kHz, while every register the
      driver writes reads back exactly as intended. Initialising the two system
      registers the reset does not leave usable (0x0B, 0x0C), as both reference
      drivers do, does not change it. The root cause is not established, so the
      reset is not shipped: a driver that silently halves its own capture
      bandwidth is worse than one that does not reset the part.

      The practical consequence is that configure() must not rely on reset
      defaults, and it does not: every route programs both directions in full,
      including powering down the converter it does not use.

  enable-gpios:
    type: phandle-array
    description: |
      GPIO that gates power to the codec, when such a switch is present. It is
      driven active before the codec is probed.
