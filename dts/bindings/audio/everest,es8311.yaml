description: |
  Everest Semiconductor ES8311 low-power mono audio codec.

  The ES8311 is a single-chip mono ADC/DAC with an I2C control interface
  (7-bit address 0x18 or 0x19, selected by the CE pin) and an I2S/PCM audio
  data interface.

  The codec can take its internal master clock either from a dedicated MCLK
  pin or from the I2S bit clock.

  This driver supports the second of those only: it programs the codec to
  derive its master clock from BCLK. With a 16-bit stereo I2S frame that puts
  the master clock at 256 * Fs at every sample rate, so one set of clock
  registers serves 8 kHz through 48 kHz. Consequently:

  - audio_codec_configure() requires audio_codec_cfg.mclk_freq to be 0. That
    field describes the clock fed to the codec's MCLK *input* pin, and this
    driver never uses that pin, so any non-zero value would be describing a
    clock that is on no pin at all. It is rejected with -ENOTSUP rather than
    accepted and ignored.
  - Word sizes other than 16 bits are rejected for the same reason: a 24-bit
    frame carries 48 bit clocks and a 32-bit frame 64, which would put the
    master clock at 384 * Fs and 512 * Fs and silently mis-clock the codec.

  A board that wires a real MCLK into the codec would need register 0x01 bit 7
  cleared and its own divider values, which this driver does not implement.

  This driver does not reset the codec, and there is no reset-gpios property,
  because the ES8311 has no reset pin. Its twenty pins are the I2C three, MCLK,
  SCLK, LRCK, ASDOUT, DSDIN, MIC1P/N, OUTP/N, the four supply pairs, and three
  analog filtering-capacitor pins. There is no signal to wire a reset line to.

  Nor does it issue the register-0x00 software reset that the reference drivers
  use. That reset does not do what its name suggests: RST_DIG is documented as
  "reset digital except control port block", and the control port block is where
  the registers live, so no value of 0x00 resets the register file. What it does
  do is clear CSM_ON, which powers the analog down -- and the ES8311's analog
  reference sits on three 1 uF capacitors (VMID, ADCVREF, DACVREF; there is no
  microphone-bias pin). Charging them back takes SECONDS. Measured on an ES8311
  on real hardware, the ADC returns a zero noise floor for about six seconds
  after the reset, and then works normally forever. No datasheet or reference
  driver specifies any settling time -- mainline Linux's es8311.c says so in as
  many words -- so nothing can be waited out from a table.

  A reset is only ever a shortcut to a known register state, and this driver
  reaches the same state the long way, by programming every register its
  behaviour depends on. That costs nothing: measured on a settled part, the
  capture noise floor was 103 counts before those writes and 109 after, with no
  settling transient at all. So capture works from the first block, on a warm
  reboot as well as a cold one, and the driver never spends six seconds deaf.

  What it cannot avoid is the same six seconds on a genuine cold power-on, when
  the board -- not the driver -- charges those capacitors. Capture is not
  trustworthy until they are charged. Playback is unaffected.

compatible: "everest,es8311"

include: [i2c-device.yaml]

properties:
  enable-gpios:
    type: phandle-array
    description: |
      GPIO that gates power to the codec, when a board puts a switch on its
      supply. It is driven active before the codec is probed. This is a
      board-level power switch, not a codec pin; the ES8311 has no enable input.

      Cutting this supply discharges the codec's analog reference capacitors, so
      capture is deaf for several seconds after it is restored. See the settling
      note above.
